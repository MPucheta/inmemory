name: Build, Publish, and Merge Down

on:
  pull_request:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

jobs:
  pr-build-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'master' && github.head_ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Auth for npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        run: |
          cd dist
          npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  merge-down:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch version (repo)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          node <<'EOF'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const [major, minor, patch] = pkg.version.split('.').map(Number);

          pkg.version = `${major}.${minor}.${patch + 1}`;

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Bump patch version (lib)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          node <<'EOF'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('./dist/package.json', 'utf8'));
          const [major, minor, patch] = pkg.version.split('.').map(Number);

          pkg.version = `${major}.${minor}.${patch + 1}`;

          fs.writeFileSync('./dist/package.json', JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add package.json ./dist/package.json
          git commit -m "chore: bump patch version after release"
          git push origin develop
